[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "serdes-coding"
version = "0.1.0"
description = "SerDes and COM modeling experiments"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "scikit-rf",
    "matplotlib",
    "pandas",
    "openpyxl",
    "xlrd",
]

[tool.setuptools.packages.find]
where = ["src"]
