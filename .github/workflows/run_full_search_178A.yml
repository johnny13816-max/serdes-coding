name: Run 178A workbook search

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      case_id:
        description: "Case under cases/; its 178A/config.xlsx defines the entire search"
        required: true
        default: case_260915_ci_small

permissions:
  contents: read

env:
  CASE_ID: ${{ inputs.case_id || 'case_260915_ci_small' }}
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: '1'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      worker_ids: ${{ steps.plan.outputs.worker_ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Create workbook search plan
        id: plan
        run: >-
          python scripts/run_full_search_178A.py prepare
          --case-root "cases/${CASE_ID}/178A"
          --output-root "cases/${CASE_ID}/178A/results/actions"
          --matrix-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: full-search-plan
          path: cases/${{ env.CASE_ID }}/178A/results/actions
          if-no-files-found: error

  partial_search:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        worker_id: ${{ fromJSON(needs.prepare.outputs.worker_ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: full-search-plan
          path: cases/${{ env.CASE_ID }}/178A/results/actions
      - name: Run partial groups
        run: >-
          python scripts/run_full_search_178A.py partial
          --case-root "cases/${CASE_ID}/178A"
          --output-root "cases/${CASE_ID}/178A/results/actions"
          --worker-id "${{ matrix.worker_id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-search-group-${{ matrix.worker_id }}
          path: cases/${{ env.CASE_ID }}/178A/results/actions/group_results/*.csv
          if-no-files-found: error

  finalize:
    needs: partial_search
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: full-search-plan
          path: cases/${{ env.CASE_ID }}/178A/results/actions
      - uses: actions/download-artifact@v4
        with:
          pattern: full-search-group-*
          path: cases/${{ env.CASE_ID }}/178A/results/actions/group_results
          merge-multiple: true
      - name: Merge, finalize and verify every plot
        run: >-
          python scripts/run_full_search_178A.py finalize
          --case-root "cases/${CASE_ID}/178A"
          --output-root "cases/${CASE_ID}/178A/results/actions"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-search-final-${{ env.CASE_ID }}
          path: cases/${{ env.CASE_ID }}/178A/results/actions
          if-no-files-found: error

  verify_artifact:
    needs: finalize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: full-search-final-${{ env.CASE_ID }}
          path: cases/${{ env.CASE_ID }}/178A/results/downloaded
      - name: Verify downloaded PNG hashes and final status
        run: >-
          python scripts/run_full_search_178A.py verify
          --output-root "cases/${CASE_ID}/178A/results/downloaded"
